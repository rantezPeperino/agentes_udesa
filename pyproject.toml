[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tp_mia_agentes_2026"
version = "0.2.0"
description = "MIA Agentes - TP M1/M2"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["mia_agents", "student_framework"]
